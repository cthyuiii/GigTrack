version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: gigtrack
      MYSQL_USER: gigtrack
      MYSQL_PASSWORD: gigtrack_pw
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      MYSQL_HOST:     mysql
      MYSQL_USER:     gigtrack
      MYSQL_PASSWORD: gigtrack_pw
      MYSQL_DB:       gigtrack
      MONGO_URI:      mongodb://mongo:27017
      REDIS_URL:      redis://redis:6379/0
      FLASK_SECRET:   change-me-in-prod
    ports: ["5000:5000"]
    command: >
      sh -c "python mongo/seed.py &&
             python -m flask --app app/app.py run --host 0.0.0.0 --port 5000"

volumes:
  mysql_data:
  mongo_data:
