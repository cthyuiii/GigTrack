services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: gigtrack
      MYSQL_USER: gigtrack
      MYSQL_PASSWORD: gigtrack_pw
    # Host-side port remapped to 3307 to avoid clashing with a locally-running
    # MySQL/MariaDB on 3306. Inside the compose network the app still uses 3306.
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Give first-time init (schema + the larger seed) time before health
      # failures count, so the app doesn't start against a half-initialised DB.
      start_period: 60s

  mongo:
    image: mongo:7
    # Remapped to 27018 in case a local Mongo is running on 27017.
    ports: ["27018:27017"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    # Remapped to 6380 in case a local Redis is running on 6379.
    ports: ["6380:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 9000 = S3 API (app + browser image URLs); 9001 = web console.
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      MYSQL_HOST:     mysql
      MYSQL_USER:     gigtrack
      MYSQL_PASSWORD: gigtrack_pw
      MYSQL_DB:       gigtrack
      MONGO_URI:      mongodb://mongo:27017
      REDIS_URL:      redis://redis:6379/0
      FLASK_SECRET:   change-me-in-prod
      # Object storage. S3_ENDPOINT is the in-network URL boto3 uses;
      # S3_PUBLIC_URL is what the browser uses for <img src> (host-mapped).
      S3_ENDPOINT:    http://minio:9000
      S3_PUBLIC_URL:  http://localhost:9000
      S3_ACCESS_KEY:  minioadmin
      S3_SECRET_KEY:  minioadmin
      S3_BUCKET:      gigtrack-media
    # Host-side port remapped to 5001 because macOS AirPlay Receiver
    # binds 5000 by default. Inside the container Flask still listens on 5000.
    ports: ["5001:5000"]
    command: >
      sh -c "python mongo/seed.py;
             python app/storage.py || true;
             python scripts/fetch_artist_images.py || true;
             python -m flask --app app/app.py run --host 0.0.0.0 --port 5000"

volumes:
  mysql_data:
  mongo_data:
  minio_data:
