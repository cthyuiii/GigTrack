{% extends "base.html" %}
{% block title %}Admin · Edit user - GigTrack{% endblock %}
{% block content %}
  <h1>Edit user #{{ user.user_id }}</h1>
  <p class="muted"><a href="{{ url_for('admin_users') }}">← Back to users</a></p>

  <form method="post" class="admin-form" action="{{ url_for('admin_user_edit', user_id=user.user_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ user.username }}" required>
    </label>
    <label>Email
      <input type="email" name="email" value="{{ user.email }}" required>
    </label>
    <label>Home city
      <input name="home_city" value="{{ user.home_city or '' }}">
    </label>
    <label class="checkbox">
      <input type="checkbox" name="is_admin" {% if user.is_admin %}checked{% endif %}> Admin
    </label>
    <label class="checkbox">
      <input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}> Active (uncheck to disable login)
    </label>
    <button>Save changes</button>
  </form>
{% endblock %}
