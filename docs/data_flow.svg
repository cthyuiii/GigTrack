<svg viewBox="0 0 1160 860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1160" height="860" fill="#ffffff"/>
<text x="24" y="34" font-size="22" font-weight="700" fill="#15171c">GigTrack — data flow across the four datastores</text>
<text x="24" y="54" font-size="13" fill="#6b7280">How the Flask app coordinates MySQL, MongoDB, Redis and MinIO across the core user journey</text>
<line x1="100" y1="104" x2="100" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="34" y="70" width="132" height="34" rx="7" fill="#555a66"/>
<text x="100" y="85" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">User /</text>
<text x="100" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">Browser</text>
<line x1="310" y1="104" x2="310" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="244" y="70" width="132" height="34" rx="7" fill="#5a4ad1"/>
<text x="310" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Flask App</text>
<line x1="520" y1="104" x2="520" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="454" y="70" width="132" height="34" rx="7" fill="#1d5fa5"/>
<text x="520" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MySQL</text>
<line x1="700" y1="104" x2="700" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="634" y="70" width="132" height="34" rx="7" fill="#1d9e75"/>
<text x="700" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MongoDB</text>
<line x1="880" y1="104" x2="880" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="814" y="70" width="132" height="34" rx="7" fill="#cf3b3b"/>
<text x="880" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Redis</text>
<line x1="1050" y1="104" x2="1050" y2="800" stroke="#d4d8e0" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="984" y="70" width="132" height="34" rx="7" fill="#d8802f"/>
<text x="1050" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MinIO</text>
<rect x="16" y="120" width="1128" height="76" rx="8" fill="#eef1fb"/>
<text x="26" y="138" font-size="13" font-weight="700" fill="#3a3f4b">1 · Sign up</text>
<rect x="16" y="208" width="1128" height="114" rx="8" fill="#eef7f1"/>
<text x="26" y="226" font-size="13" font-weight="700" fill="#3a3f4b">2 · Log in</text>
<rect x="16" y="334" width="1128" height="118" rx="8" fill="#fdeef0"/>
<text x="26" y="352" font-size="13" font-weight="700" fill="#3a3f4b">3 · Book ticket</text>
<rect x="16" y="464" width="1128" height="148" rx="8" fill="#fdf4ec"/>
<text x="26" y="482" font-size="13" font-weight="700" fill="#3a3f4b">4 · Write review</text>
<rect x="16" y="624" width="1128" height="88" rx="8" fill="#eef1fb"/>
<text x="26" y="642" font-size="13" font-weight="700" fill="#3a3f4b">5 · Log out</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3a3f4b"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa1ad"/></marker></defs>
<line x1="100" y1="150" x2="310" y2="150" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205.0" y="144" text-anchor="middle" font-size="11.5" fill="#2a2e38">submit sign-up form</text>
<line x1="310" y1="174" x2="520" y2="174" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415.0" y="168" text-anchor="middle" font-size="11.5" fill="#2a2e38">INSERT users (bcrypt-hashed pw)</text>
<line x1="310" y1="192" x2="100" y2="192" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="205.0" y="186" text-anchor="middle" font-size="11.5" fill="#2a2e38">redirect → login</text>
<line x1="100" y1="238" x2="310" y2="238" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205.0" y="232" text-anchor="middle" font-size="11.5" fill="#2a2e38">email + password</text>
<line x1="310" y1="262" x2="520" y2="262" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415.0" y="256" text-anchor="middle" font-size="11.5" fill="#2a2e38">SELECT user; bcrypt.checkpw()</text>
<line x1="310" y1="286" x2="880" y2="286" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="595.0" y="280" text-anchor="middle" font-size="11.5" fill="#2a2e38">SETEX session:{token} (30 min)</text>
<line x1="310" y1="310" x2="100" y2="310" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="205.0" y="304" text-anchor="middle" font-size="11.5" fill="#2a2e38">Set-Cookie + redirect home</text>
<line x1="100" y1="364" x2="310" y2="364" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205.0" y="358" text-anchor="middle" font-size="11.5" fill="#2a2e38">POST book (ticket, qty)</text>
<line x1="310" y1="388" x2="520" y2="388" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415.0" y="382" text-anchor="middle" font-size="11.5" fill="#2a2e38">INSERT bookings</text>
<path d="M520,404 h46 v18 h-46" fill="none" stroke="#3a3f4b" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="574" y="412" font-size="11.5" fill="#2a2e38">BEFORE INSERT trigger: seats −= qty  (or SIGNAL → rollback)</text>
<line x1="310" y1="442" x2="100" y2="442" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="205.0" y="436" text-anchor="middle" font-size="11.5" fill="#2a2e38">flash 'booked' / 'sold out'</text>
<line x1="100" y1="494" x2="310" y2="494" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205.0" y="488" text-anchor="middle" font-size="11.5" fill="#2a2e38">POST review (+ photo)</text>
<line x1="310" y1="518" x2="1050" y2="518" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="680.0" y="512" text-anchor="middle" font-size="11.5" fill="#2a2e38">PUT photo blob (resized)</text>
<line x1="1050" y1="540" x2="310" y2="540" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="680.0" y="534" text-anchor="middle" font-size="11.5" fill="#2a2e38">object URL</text>
<line x1="310" y1="566" x2="700" y2="566" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="505.0" y="560" text-anchor="middle" font-size="11.5" fill="#2a2e38">insert review { …, photos:[{url}] }</text>
<line x1="310" y1="590" x2="100" y2="590" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="205.0" y="584" text-anchor="middle" font-size="11.5" fill="#2a2e38">redirect → concert</text>
<line x1="100" y1="654" x2="310" y2="654" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205.0" y="648" text-anchor="middle" font-size="11.5" fill="#2a2e38">GET /logout</text>
<line x1="310" y1="678" x2="880" y2="678" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="595.0" y="672" text-anchor="middle" font-size="11.5" fill="#2a2e38">DEL session:{token}</text>
<line x1="310" y1="702" x2="100" y2="702" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="205.0" y="696" text-anchor="middle" font-size="11.5" fill="#2a2e38">clear cookie + redirect home</text>
<text x="26" y="740" font-size="12" font-weight="700" fill="#3a3f4b">Also on every concert page (read path):</text>
<text x="40" y="760" font-size="11.5" fill="#2a2e38">MySQL → concert / tickets / lineup ·  MongoDB → setlist + reviews ·  Redis → view counter + cached trending list ·  MinIO → serves images</text>
<line x1="26" y1="784" x2="60" y2="784" stroke="#3a3f4b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="66" y="788" font-size="11.5" fill="#555">request / write</text>
<line x1="190" y1="784" x2="224" y2="784" stroke="#9aa1ad" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<text x="230" y="788" font-size="11.5" fill="#555">response / redirect</text>
</svg>